th:['Specific latent heat of fusion L_f is the heat needed to change 1 kg of ice at 0 °C into water at 0 °C. Mixing method: heat lost by warm water + calorimeter = heat to melt ice + heat to warm melted ice to θ₂.<div class=fm>(m_w c_w + m₁c_c)(θ₁ − θ₂) = m_i L_f + m_i c_w θ₂<br>Apparatus: copper calorimeter & stirrer, electronic balance, thermometer, dry ice cubes, filter paper, warm water.</div>','විශිෂ්ට ද්‍රවීකරණ ගුප්ත තාපය L_f යනු 0 °C හි අයිස් 1 kg ක් 0 °C හි ජලය බවට පත් කිරීමට අවශ්‍ය තාපයයි. මිශ්‍ර කිරීමේ ක්‍රමය: උණුසුම් ජලය හා කැලරිමීටරය නැති කළ තාපය = අයිස් දියවීමට හා දියවූ ජලය θ₂ දක්වා රත් වීමට අවශ්‍ය තාපය.<div class=fm>(m_w c_w + m₁c_c)(θ₁ − θ₂) = m_i L_f + m_i c_w θ₂<br>උපකරණ: කැලරිමීටරය හා කලවමක්, ඉලෙක්ට්‍රොනික තුලාව, උෂ්ණත්වමානය, වියළි අයිස් කැට, පෙරහන් කඩදාසි, උණුසුම් ජලය.</div>'],

th:['Eugenol (60–90 % of clove oil, b.p. ≈ 250 °C) would decompose if heated directly. Boiling cloves with water co-distils it with steam just below 100 °C; the cloudy distillate holds free eugenol droplets that are extracted and analysed (e.g. by IR).'+AP('Apparatus: 100 mL flask, cloves (~3 g), water, glass bead, condenser, ice-bath receiver.'),'යූජිනෝල් (කරාබුනැටි තෙලෙන් 60–90 %, තාපාංකය ≈ 250 °C) කෙළින්ම රත් කළහොත් වියෝජනය වේ. කරාබුනැටි ජලය සමඟ නැටවීමෙන් එය 100 °C ට මදක් අඩුවෙන් වාෂ්ප සමඟ ආසවනය වේ; බොර ආසවනයේ ඇති යූජිනෝල් බිංදු නිස්සාරණය කර විශ්ලේෂණය කරයි (උදා: IR).'+AP('උපකරණ: 100 mL ප්ලාස්කුව, කරාබුනැටි (~3 g), ජලය, වීදුරු ගුලිය, කොන්ඩෙන්සරය, අයිස් ස්නානයේ ග්‍රාහකය.')],
st:[['Weigh ~3 g of cloves; add 35–40 mL water and soak for 15 min.','Set up simple distillation; receiver in an ice bath.','Start condenser water; heat to a steady rate (avoid bumping).','Collect the cloudy distillate; extract and characterise eugenol.'],['කරාබුනැටි ~3 g කිරා ජලය 35–40 mL එක් කර මිනිත්තු 15ක් පොඟවන්න.','සරල ආසවන උපකරණය සවි කරන්න; ග්‍රාහකය අයිස් ස්නානයේ තබන්න.','සිසිලන ජලය අරඹා ස්ථාවර වේගයෙන් රත් කරන්න.','බොර ආසවනය එකතු කර යූජිනෝල් නිස්සාරණය කර හඳුනාගන්න.']],
